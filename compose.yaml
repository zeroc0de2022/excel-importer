# Local development stack. Variables like ${DB_DATABASE} come from the Laravel .env file.
name: excel-importer

x-app: &app
  build:
    context: .
    target: dev
    args:
      UID: ${UID:-1000}
      GID: ${GID:-1000}
  image: excel-importer-dev
  volumes:
    - .:/var/www/html
  restart: unless-stopped
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  app:
    <<: *app
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@fsockopen('127.0.0.1', 9000) ? 0 : 1);"]
      interval: 5s
      timeout: 3s
      retries: 10

  queue:
    <<: *app
    # --max-jobs / --max-time recycle the process regularly, so memory can't grow forever
    command: php artisan queue:work redis --sleep=1 --max-jobs=1000 --max-time=3600 --memory=256
    stop_grace_period: 60s

  scheduler:
    <<: *app
    command: php artisan schedule:work

  reverb:
    <<: *app
    command: php artisan reverb:start --host=0.0.0.0 --port=8080
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@fsockopen('127.0.0.1', 8080) ? 0 : 1);"]
      interval: 5s
      timeout: 3s
      retries: 10

  nginx:
    image: nginx:stable-alpine
    ports:
      - "${APP_PORT:-8000}:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./public:/var/www/html/public:ro
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
      reverb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/up"]
      interval: 5s
      timeout: 3s
      retries: 10

  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8-alpine
    command: redis-server --appendonly yes
    volumes:
      - redisdata:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # One-off helper for building frontend assets: `docker compose run --rm node npm run build`
  node:
    image: node:22-alpine
    working_dir: /app
    user: "${UID:-1000}:${GID:-1000}"
    volumes:
      - .:/app
    profiles: [tools]

volumes:
  pgdata:
  redisdata:
